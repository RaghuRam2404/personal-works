<div class="s-bg slide-type-A5"></div>
<div class="doodle-ph">
  <img src="{{DOODLE_SRC}}" alt="{{DOODLE_ALT}}" />
  <div class="doodle-ph-icon">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><path d="M32 4L40 12L14 38H6V30L32 4Z" stroke="#34C363" stroke-width="2" stroke-linejoin="round"/><path d="M26 10L34 18" stroke="#34C363" stroke-width="2"/><path d="M6 30L14 38" stroke="#34C363" stroke-width="2"/></svg>
    <span>Doodle<br>placeholder</span>
  </div>
</div>
<div style="position:absolute;top:55px;left:60px;">
  <span class="s-counter">{{COUNTER}}</span>
</div>
<div style="position:absolute;top:55px;right:60px;">
  <img src="{{LOGO_SRC}}" alt="DadFit" style="height:96px;mix-blend-mode:screen;display:block;" />
</div>
<div style="position:absolute;top:50%;left:60px;right:60px;transform:translateY(-50%);">
  <div style="font-family:'Permanent Marker',cursive;font-size:72px;color:#34C363;line-height:1.1;margin-bottom:28px;">{{CHALLENGE_WORD}}</div>
  <div style="font-family:'Inter',sans-serif;font-weight:800;font-size:100px;line-height:0.95;color:#fff;text-transform:uppercase;letter-spacing:-2px;">
    {{HEADLINE}}
  </div>
  <div style="margin-top:38px;display:flex;align-items:center;gap:24px;">
    <div class="s-green-bar" style="width:72px;"></div>
    <div style="font-family:'Caveat',cursive;font-weight:400;font-size:38px;color:#ADADAD;">{{SUBTEXT}}</div>
  </div>
</div>
<div style="position:absolute;bottom:52px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-arrow">&rarr;</span>
</div>
