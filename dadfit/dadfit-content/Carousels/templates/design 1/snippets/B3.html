<div style="position:absolute;inset:0;background:linear-gradient(160deg,#1a2820 0%,#243828 100%);" class="slide-type-B3">
  <img src="{{PHOTO_SRC}}" alt="{{PHOTO_ALT}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />
</div>
<div style="position:absolute;inset:0;background:rgba(0,0,0,0.55);"></div>
<div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(20,30,20,0.45) 55%,#1E1E1E 100%);"></div>
<div style="position:absolute;top:55px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-counter">{{COUNTER}}</span>
</div>
<div style="position:absolute;bottom:110px;left:60px;right:60px;">
  <div style="font-family:'Inter',sans-serif;font-weight:800;font-size:72px;line-height:1.0;color:#fff;text-transform:uppercase;letter-spacing:-1px;">
    {{HEADLINE}}
  </div>
  <div style="margin-top:22px;font-family:'Inter',sans-serif;font-weight:400;font-size:28px;color:rgba(255,255,255,0.7);line-height:1.65;">
    {{BODY}}
  </div>
</div>

  <span class="s-arrow">&rarr;</span>
