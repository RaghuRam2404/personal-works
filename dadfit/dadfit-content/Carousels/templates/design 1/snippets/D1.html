<div class="s-bg slide-type-D1" style="background:linear-gradient(145deg,#101a1c 0%,#141e20 30%,#181e1e 58%,#1c1e1e 100%);"></div>
<div class="gradient-glow" style="position:absolute;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(52,195,99,0.07) 0%,transparent 55%);pointer-events:none;"></div>
<div class="doodle-ph">
  <img src="{{DOODLE_SRC}}" alt="{{DOODLE_ALT}}" />
  <div class="doodle-ph-icon">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><path d="M32 4L40 12L14 38H6V30L32 4Z" stroke="#34C363" stroke-width="2" stroke-linejoin="round"/><path d="M26 10L34 18" stroke="#34C363" stroke-width="2"/><path d="M6 30L14 38" stroke="#34C363" stroke-width="2"/></svg>
    <span>Doodle<br>placeholder</span>
  </div>
</div>
<div style="position:absolute;top:55px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-counter">{{COUNTER}}</span>
</div>
<div class="s-zone">
  <div style="font-family:'Permanent Marker',cursive;font-size:52px;color:#34C363;">{{STAT_LABEL}}</div>
  <div>
    <div style="font-family:'Inter',sans-serif;font-weight:800;font-size:230px;line-height:0.9;color:#34C363;letter-spacing:-6px;">{{BIG_NUMBER}}</div>
    <div style="margin-top:20px;font-family:'Inter',sans-serif;font-weight:400;font-size:34px;color:#fff;line-height:1.6;text-align:left;">
      {{STAT_CONTEXT}}
    </div>
  </div>
  <div>
    <div class="s-green-bar" style="width:90px;margin-bottom:26px;"></div>
    <div style="font-family:'Caveat',cursive;font-weight:400;font-size:42px;color:#ADADAD;line-height:1.45;text-align:left;">
      &ldquo;{{STAT_CAVEAT}}&rdquo;
    </div>
  </div>
</div>
<div style="position:absolute;bottom:52px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-arrow">&rarr;</span>
</div>
