<div class="s-bg slide-type-A2"></div>
<div style="position:absolute;inset:0;top:60px;bottom:60px;left:75px;right:75px;display:flex;align-items:center;gap:50px;">
  <div style="flex:1;min-width:0;">
    <div style="font-family:'Inter',sans-serif;font-weight:800;font-size:88px;line-height:1.0;color:#fff;text-transform:uppercase;letter-spacing:-2px;">
      {{HEADLINE}}
    </div>
    <div style="margin-top:32px;font-family:'Inter',sans-serif;font-weight:400;font-size:24px;color:#ADADAD;line-height:1.6;">
      {{SUBTEXT}}
    </div>
  </div>
  <div class="photo-ph" style="width:350px;height:440px;border:1px solid rgba(52,195,99,0.5);flex-shrink:0;background:linear-gradient(160deg,#1a2820 0%,#263520 100%);">
    <img src="{{PHOTO_SRC}}" alt="{{PHOTO_ALT}}" />
    <div class="photo-ph-icon">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="2" y="9" width="40" height="30" rx="5" stroke="#fff" stroke-width="2"/><circle cx="22" cy="24" r="9" stroke="#fff" stroke-width="2"/><rect x="15" y="7" width="14" height="4" rx="2" fill="#fff"/><circle cx="36" cy="16" r="2" fill="#fff"/></svg>
      <span style="color:#fff;">{{PHOTO_ALT}}</span>
    </div>
  </div>
</div>
