<div class="s-bg slide-type-C3"></div>
<div class="doodle-ph">
  <img src="{{DOODLE_SRC}}" alt="{{DOODLE_ALT}}" />
  <div class="doodle-ph-icon">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><path d="M32 4L40 12L14 38H6V30L32 4Z" stroke="#34C363" stroke-width="2" stroke-linejoin="round"/><path d="M26 10L34 18" stroke="#34C363" stroke-width="2"/><path d="M6 30L14 38" stroke="#34C363" stroke-width="2"/></svg>
    <span>Doodle<br>placeholder</span>
  </div>
</div>
<div style="position:absolute;top:55px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-counter">{{COUNTER}}</span>
</div>
<div class="s-zone">
  <div style="font-family:'Permanent Marker',cursive;font-size:56px;color:#FF6B6B;">MYTH &mdash;</div>
  <div style="background:#292929;border-left:4px solid #FF6B6B;border-radius:0 12px 12px 0;padding:40px 36px;">
    <div style="font-family:'Inter',sans-serif;font-weight:800;font-size:60px;line-height:1.05;color:#fff;letter-spacing:-1px;">
      &ldquo;{{MYTH_TEXT}}&rdquo;
    </div>
  </div>
  <div style="background:#292929;border-left:4px solid #34C363;border-radius:0 12px 12px 0;padding:40px 36px;">
    <div style="font-family:'Permanent Marker',cursive;font-size:32px;color:#34C363;margin-bottom:14px;">TRUTH &mdash;</div>
    <div style="font-family:'Inter',sans-serif;font-weight:700;font-size:42px;line-height:1.15;color:#fff;">{{TRUTH_TEXT}}</div>
  </div>
</div>
<div style="position:absolute;bottom:52px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-arrow">&rarr;</span>
</div>
