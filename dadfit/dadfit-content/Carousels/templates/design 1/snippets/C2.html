<div class="s-bg slide-type-C2"></div>
<div style="position:absolute;top:55px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-counter">{{COUNTER}}</span>
</div>
<div style="position:absolute;top:160px;bottom:110px;left:75px;right:75px;display:flex;gap:44px;align-items:flex-start;">
  <div style="flex:1;min-width:0;">
    <div style="font-family:'Permanent Marker',cursive;font-size:42px;color:#FF6B6B;margin-bottom:30px;">
      {{PAIN_LABEL}}
    </div>
    <div style="font-family:'Inter',sans-serif;font-weight:700;font-size:50px;line-height:1.25;color:#fff;text-align:left;">
      {{PAIN_LINE1}}<br><span style="color:#FF6B6B;">{{PAIN_LINE2}}</span>
    </div>
    <div style="margin-top:28px;font-family:'Inter',sans-serif;font-weight:400;font-size:27px;color:#ADADAD;line-height:1.65;text-align:left;">
      {{REFRAME}}
    </div>
  </div>
  <div class="photo-ph" style="width:340px;height:490px;border:1px solid rgba(255,107,107,0.25);flex-shrink:0;background:linear-gradient(160deg,#201a1a 0%,#2e2020 100%);">
    <img src="{{PHOTO_SRC}}" alt="{{PHOTO_ALT}}" />
    <div class="photo-ph-icon">
      <svg width="40" height="40" viewBox="0 0 44 44" fill="none"><rect x="2" y="9" width="40" height="30" rx="5" stroke="#FF6B6B" stroke-width="2" opacity="0.5"/><circle cx="22" cy="24" r="9" stroke="#FF6B6B" stroke-width="2" opacity="0.5"/></svg>
      <span style="color:#FF6B6B;opacity:0.5;">{{PHOTO_ALT}}</span>
    </div>
  </div>
</div>
<div style="position:absolute;bottom:52px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-arrow">&rarr;</span>
</div>
