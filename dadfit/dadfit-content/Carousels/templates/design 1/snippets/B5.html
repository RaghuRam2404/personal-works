<div class="s-bg slide-type-B5" style="background:linear-gradient(150deg,#131520 0%,#171b26 35%,#1a1e24 60%,#1c1e22 100%);"></div>
<div class="gradient-glow" style="position:absolute;inset:0;background:radial-gradient(ellipse at 70% 60%,rgba(52,195,99,0.03) 0%,transparent 50%);pointer-events:none;"></div>
<div class="doodle-ph">
  <img src="{{DOODLE_SRC}}" alt="{{DOODLE_ALT}}" />
  <div class="doodle-ph-icon">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><path d="M32 4L40 12L14 38H6V30L32 4Z" stroke="#34C363" stroke-width="2" stroke-linejoin="round"/><path d="M26 10L34 18" stroke="#34C363" stroke-width="2"/><path d="M6 30L14 38" stroke="#34C363" stroke-width="2"/></svg>
    <span>Doodle<br>placeholder</span>
  </div>
</div>
<div style="position:absolute;top:55px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-counter">{{COUNTER}}</span>
</div>
<div class="s-zone">
  <div>
    <div style="font-family:'Inter',sans-serif;font-weight:800;font-size:60px;line-height:1.05;color:#fff;letter-spacing:-1px;">
      {{HEADLINE}}
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;">
    <div style="background:#292929;border-top:4px solid #FF6B6B;border-radius:0 0 12px 12px;padding:32px 28px;">
      <div style="font-family:'Permanent Marker',cursive;font-size:30px;color:#FF6B6B;margin-bottom:20px;">WRONG</div>
      <div style="font-family:'Inter',sans-serif;font-weight:500;font-size:26px;color:#ADADAD;line-height:1.65;">{{WRONG_ITEMS}}</div>
    </div>
    <div style="background:#292929;border-top:4px solid #34C363;border-radius:0 0 12px 12px;padding:32px 28px;">
      <div style="font-family:'Permanent Marker',cursive;font-size:30px;color:#34C363;margin-bottom:20px;">RIGHT</div>
      <div style="font-family:'Inter',sans-serif;font-weight:500;font-size:26px;color:#fff;line-height:1.65;">{{RIGHT_ITEMS}}</div>
    </div>
  </div>
  <div style="font-family:'Caveat',cursive;font-weight:400;font-size:38px;color:#ADADAD;">{{CAVEAT}}</div>
</div>
<div style="position:absolute;bottom:52px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-arrow">&rarr;</span>
</div>
