<div style="position:absolute;inset:0;background:linear-gradient(160deg,#101a10 0%,#1c2a1c 100%);" class="slide-type-D2">
  <img src="{{PHOTO_SRC}}" alt="{{PHOTO_ALT}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />
</div>
<div style="position:absolute;inset:0;background:rgba(0,0,0,0.65);"></div>
<div style="position:absolute;top:55px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-counter">{{COUNTER}}</span>
</div>
<div style="position:absolute;bottom:130px;left:60px;right:60px;">
  <div style="font-family:'Permanent Marker',cursive;font-size:40px;color:#34C363;margin-bottom:16px;">{{STAT_LABEL}}</div>
  <div style="font-family:'Inter',sans-serif;font-weight:800;font-size:200px;line-height:0.9;color:#34C363;letter-spacing:-5px;">{{BIG_NUMBER}}</div>
  <div style="margin-top:24px;font-family:'Inter',sans-serif;font-weight:400;font-size:29px;color:rgba(255,255,255,0.75);line-height:1.6;text-align:left;">
    {{STAT_CONTEXT}}
  </div>
</div>
<div style="position:absolute;bottom:52px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-arrow">&rarr;</span>
</div>
