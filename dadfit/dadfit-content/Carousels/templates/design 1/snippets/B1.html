<div class="s-bg slide-type-B1"></div>
<div class="doodle-ph">
  <img src="{{DOODLE_SRC}}" alt="{{DOODLE_ALT}}" />
  <div class="doodle-ph-icon">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><path d="M32 4L40 12L14 38H6V30L32 4Z" stroke="#34C363" stroke-width="2" stroke-linejoin="round"/><path d="M26 10L34 18" stroke="#34C363" stroke-width="2"/><path d="M6 30L14 38" stroke="#34C363" stroke-width="2"/></svg>
    <span>Doodle<br>placeholder</span>
  </div>
</div>
<div style="position:absolute;top:55px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-counter">{{COUNTER}}</span>
</div>
<div class="s-zone">
  <div>
    <div style="font-family:'Inter',sans-serif;font-weight:800;font-size:68px;line-height:1.05;color:#fff;letter-spacing:-1.5px;">
      {{HEADLINE}}
    </div>
  </div>
  <div style="font-family:'Inter',sans-serif;font-weight:400;font-size:33px;color:#fff;line-height:1.7;text-align:left;">
    {{BODY}}
  </div>
  <div>
    <div class="s-green-bar" style="width:90px;margin-bottom:22px;"></div>
    <div style="font-family:'Caveat',cursive;font-weight:400;font-size:40px;color:#34C363;">{{CAVEAT}}</div>
  </div>
</div>
<div style="position:absolute;bottom:52px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-arrow">&rarr;</span>
</div>
