<div class="s-bg slide-type-B2" style="background:linear-gradient(150deg,#131520 0%,#171b26 35%,#1a1e24 60%,#1c1e22 100%);"></div>
<div class="gradient-glow" style="position:absolute;inset:0;background:radial-gradient(ellipse at 20% 80%,rgba(52,195,99,0.03) 0%,transparent 50%);pointer-events:none;"></div>
<div style="position:absolute;top:55px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-counter">{{COUNTER}}</span>
</div>
<div style="position:absolute;top:275px;bottom:110px;left:75px;right:75px;display:flex;gap:44px;align-items:flex-start;">
  <div style="flex:1;min-width:0;">
    <div style="font-family:'Inter',sans-serif;font-weight:800;font-size:68px;line-height:1.05;color:#fff;letter-spacing:-1.5px;margin-bottom:28px;">
      {{HEADLINE}}
    </div>
    <div style="font-family:'Inter',sans-serif;font-weight:400;font-size:30px;color:#fff;line-height:1.7;">
      {{BODY}}
    </div>
  </div>
  <div class="photo-ph" style="width:340px;height:490px;border:1px solid rgba(52,195,99,0.35);flex-shrink:0;background:linear-gradient(160deg,#1a2820 0%,#263520 100%);">
    <img src="{{PHOTO_SRC}}" alt="{{PHOTO_ALT}}" />
    <div class="photo-ph-icon">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="2" y="9" width="40" height="30" rx="5" stroke="#fff" stroke-width="2"/><circle cx="22" cy="24" r="9" stroke="#fff" stroke-width="2"/><rect x="15" y="7" width="14" height="4" rx="2" fill="#fff"/></svg>
      <span style="color:#fff;">{{PHOTO_ALT}}</span>
    </div>
  </div>
</div>
<div style="position:absolute;bottom:52px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;">
  <span class="s-arrow">&rarr;</span>
</div>
