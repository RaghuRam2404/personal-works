<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DadFit — Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="dash-page">

  <nav class="topnav">
    <a class="topnav-brand" href="/"><img src="/logo.svg" alt="DadFit" class="topnav-logo"></a>
    <div class="topnav-links">
      <a href="/" class="topnav-link">Home</a>
      <a href="/viewer" class="topnav-link">Viewer</a>
      <a href="/dashboard" class="topnav-link active">Dashboard</a>
      <a href="/analytics" class="topnav-link">Analytics</a>
    </div>
  </nav>

  <div class="dash-controls">
    <label class="batch-label">Batch</label>
    <select class="batch-select" id="batch-select"></select>
    <input class="dash-search" id="search" type="text" placeholder="Search title…" autocomplete="off">
    <span class="dash-count" id="dash-count"></span>
  </div>

  <div class="dash-table-wrap">
    <table class="dash-table">
      <thead>
        <tr>
          <th data-col="running_no">#</th>
          <th data-col="title">Title</th>
          <th data-col="category">Cat</th>
          <th data-col="current_stage">Stage</th>
          <th data-col="upload_status">Upload</th>
          <th data-col="published_date">Published</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody id="dash-tbody"></tbody>
    </table>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" style="display:none">
    <img id="lightbox-img" src="" alt="Slide preview">
  </div>

  <script>
    const CAT_COLOR   = { TOFU: '#4a9eff', MOFU: '#e67e22', BOFU: '#34C363' };
    const STAGE_COLOR = {
      HTML_CREATED:  '#555',  DOODLES_DONE: '#e6a817', HTML_APPROVED: '#34C363',
      IMAGES_CREATED:'#4a9eff', PUBLISHED: '#34C363',  MONITORED: '#9b59b6',
    };

    let currentBatch = '1';
    let allCarousels = [];
    let expandedUuid = null;
    let sortCol = 'running_no', sortAsc = true;

    // ── Init ──────────────────────────────────────────────────────────────────
    async function init() {
      const res     = await fetch('/api/batches');
      const batches = await res.json();
      const sel     = document.getElementById('batch-select');
      batches.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b; opt.textContent = `Batch ${b}`;
        if (String(b) === currentBatch) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', () => {
        currentBatch = sel.value;
        expandedUuid = null;
        loadCarousels();
      });
      await loadCarousels();
    }

    async function loadCarousels() {
      const res    = await fetch(`/api/carousels-full?batch=${currentBatch}`);
      allCarousels = await res.json();
      applyFilter();
    }

    function applyFilter() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const filtered = q
        ? allCarousels.filter(c => c.title.toLowerCase().includes(q) || String(c.running_no).includes(q))
        : allCarousels;
      renderTable(sortData(filtered));
    }

    function sortData(data) {
      return [...data].sort((a, b) => {
        const av = a[sortCol] ?? '', bv = b[sortCol] ?? '';
        const cmp = String(av).localeCompare(String(bv), undefined, { numeric: true });
        return sortAsc ? cmp : -cmp;
      });
    }

    // ── Table ─────────────────────────────────────────────────────────────────
    function renderTable(carousels) {
      document.getElementById('dash-count').textContent = `${carousels.length} carousel(s)`;
      const tbody = document.getElementById('dash-tbody');
      tbody.innerHTML = '';

      carousels.forEach(c => {
        const catColor   = CAT_COLOR[c.category]       || '#888';
        const stageColor = STAGE_COLOR[c.current_stage] || '#555';
        const uploadBadge = c.upload_status === 'PUBLISHED'
          ? '<span class="badge" style="background:#34C363;color:#000;font-size:10px">Published</span>'
          : '<span style="color:#444;font-size:12px">Pending</span>';
        const pubDate = c.published_date
          ? `<span style="font-size:12px;color:#aaa">${c.published_date.substring(0,10)}</span>`
          : '<span style="color:#333">—</span>';
        const isExp = expandedUuid === c.uuid;

        // Data row
        const tr = document.createElement('tr');
        tr.className = 'data-row' + (isExp ? ' expanded' : '');
        tr.dataset.uuid = c.uuid;
        tr.innerHTML = `
          <td class="col-no">${c.running_no}</td>
          <td><span class="col-title-text" title="${escHtml(c.title)}">${escHtml(c.title)}</span></td>
          <td><span class="badge" style="background:${catColor};color:#000;font-size:10px">${c.category||'—'}</span></td>
          <td><span class="badge" style="background:${stageColor};color:#fff;font-size:10px">${c.current_stage||'—'}</span></td>
          <td>${uploadBadge}</td>
          <td>${pubDate}</td>
          <td class="col-actions">
            <button class="edit-btn${isExp ? ' active' : ''}" data-uuid="${c.uuid}">
              ${isExp ? '▲ Close' : '▼ Edit'}
            </button>
          </td>
        `;
        tbody.appendChild(tr);

        // Edit / detail row
        if (isExp) {
          const editTr = document.createElement('tr');
          editTr.className = 'edit-row';
          editTr.id = `edit-row-${c.uuid}`;
          editTr.innerHTML = `
            <td colspan="7">
              <div class="edit-panel">
                <div class="edit-fields">
                  <div class="field-group">
                    <label class="field-label">Hook</label>
                    <input class="field-input" id="f-hook-${c.uuid}" value="${escHtml(c.hook||'')}">
                  </div>
                  <div class="field-group">
                    <label class="field-label">CTA</label>
                    <input class="field-input" id="f-cta-${c.uuid}" value="${escHtml(c.cta||'')}">
                  </div>
                  <div class="field-group">
                    <label class="field-label">Caption</label>
                    <textarea class="field-textarea" id="f-caption-${c.uuid}">${escHtml(c.caption||'')}</textarea>
                  </div>
                  <div class="field-group">
                    <label class="field-label">Script Content</label>
                    <textarea class="field-textarea tall" id="f-script-${c.uuid}">${escHtml(c.script_content||'')}</textarea>
                  </div>
                  <div class="edit-actions">
                    <button class="save-btn" id="save-btn-${c.uuid}" onclick="saveEdits('${c.uuid}')">Save</button>
                    <button class="cancel-btn" onclick="closeEdit()">Cancel</button>
                    <span class="save-status" id="save-status-${c.uuid}"></span>
                  </div>
                </div>
                <div class="edit-slides">
                  <div class="edit-slides-title">Slides</div>
                  <div class="slides-grid" id="slides-grid-${c.uuid}">
                    <div class="slides-empty">Loading…</div>
                  </div>
                </div>
              </div>
            </td>
          `;
          tbody.appendChild(editTr);
          loadSlides(c.uuid, c.folder_name);
        }
      });

      // Sort header click handlers
      document.querySelectorAll('.dash-table th[data-col]').forEach(th => {
        th.classList.toggle('sorted', th.dataset.col === sortCol);
        th.onclick = () => {
          if (sortCol === th.dataset.col) sortAsc = !sortAsc;
          else { sortCol = th.dataset.col; sortAsc = true; }
          applyFilter();
        };
      });

      // Edit button handlers
      document.querySelectorAll('.edit-btn[data-uuid]').forEach(btn => {
        btn.onclick = () => toggleEdit(btn.dataset.uuid);
      });
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    // ── Edit row ──────────────────────────────────────────────────────────────
    function toggleEdit(uuid) {
      expandedUuid = (expandedUuid === uuid) ? null : uuid;
      applyFilter();
      if (expandedUuid) {
        setTimeout(() => {
          const el = document.getElementById(`edit-row-${uuid}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 60);
      }
    }

    function closeEdit() {
      expandedUuid = null;
      applyFilter();
    }

    async function loadSlides(uuid, folder) {
      const grid = document.getElementById(`slides-grid-${uuid}`);
      if (!grid) return;
      if (!folder) { grid.innerHTML = '<div class="slides-empty">No folder yet</div>'; return; }
      const res   = await fetch(`/api/slides/${currentBatch}/${folder}`);
      const files = await res.json();
      if (!files.length) { grid.innerHTML = '<div class="slides-empty">No slides found</div>'; return; }
      grid.innerHTML = files
        .map(f => `<img class="slide-thumb" src="/slides/${currentBatch}/${folder}/${f}" alt="${f}" loading="lazy">`)
        .join('');
      grid.querySelectorAll('.slide-thumb').forEach(img => {
        img.onclick = () => openLightbox(img.src);
      });
    }

    async function saveEdits(uuid) {
      const statusEl = document.getElementById(`save-status-${uuid}`);
      const saveBtn  = document.getElementById(`save-btn-${uuid}`);
      saveBtn.disabled = true;
      statusEl.textContent = 'Saving…';
      statusEl.style.color = 'var(--muted)';

      const body = {
        hook:           document.getElementById(`f-hook-${uuid}`)?.value,
        cta:            document.getElementById(`f-cta-${uuid}`)?.value,
        caption:        document.getElementById(`f-caption-${uuid}`)?.value,
        script_content: document.getElementById(`f-script-${uuid}`)?.value,
      };

      const res  = await fetch(`/api/carousel/${uuid}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();

      if (data.ok) {
        const c = allCarousels.find(x => x.uuid === uuid);
        if (c) Object.assign(c, body);
        statusEl.textContent = '✓ Saved';
        statusEl.style.color = 'var(--green)';
        setTimeout(() => { statusEl.textContent = ''; }, 2000);
      } else {
        statusEl.textContent = '✗ ' + (data.error || 'Error');
        statusEl.style.color = '#e55';
      }
      saveBtn.disabled = false;
    }

    // ── Lightbox ──────────────────────────────────────────────────────────────
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }
    document.getElementById('lightbox').addEventListener('click', () => {
      document.getElementById('lightbox').style.display = 'none';
    });

    // ── Search ────────────────────────────────────────────────────────────────
    document.getElementById('search').addEventListener('input', applyFilter);

    init();
  </script>
</body>
</html>
